<style>
:root{
  --gold:#e9b949; --gold-deep:#c99a2e; --gold-soft:#fbf3df;
  --ink:#2f2f2e; --ink-soft:#5d5c58; --line:#e8e3d8;
  --paper:#fffdf8; --white:#ffffff;
  --wa:#1fa855; --wa-deep:#178a45;
  --display:"Josefin Sans", "Futura", "Century Gothic", sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

header{background:var(--white);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
header img{height:54px;width:auto;display:block}

.hero{padding:64px 0 72px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-180px;top:-160px;width:560px;height:560px;border:1.5px solid var(--gold);border-radius:50%;opacity:.35}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;position:relative}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.22em;font-size:13px;font-weight:600;color:var(--gold-deep)}
h1{font-family:var(--display);font-weight:300;font-size:clamp(38px,5.2vw,60px);line-height:1.05;margin:14px 0 20px;text-wrap:balance}
h1 strong{font-weight:700}
.lede{font-size:18px;color:var(--ink-soft);max-width:34em}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 18px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;transition:transform .15s ease, background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-book{background:var(--ink);color:var(--white)}
.btn-book:hover{background:#000}
.btn-wa{background:var(--wa);color:var(--white)}
.btn-wa:hover{background:var(--wa-deep)}
.btn svg{width:20px;height:20px;flex:none}
.reassure{font-size:14px;color:var(--ink-soft)}
.reassure span{display:inline-block;margin-right:16px}
.reassure span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle}

.video-card{justify-self:center;width:100%;max-width:360px}
.video-frame{position:relative;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 30px 60px -25px rgba(47,47,46,.45);aspect-ratio:9/16}
.video-frame video{width:100%;height:100%;display:block;object-fit:cover}
.video-cap{margin-top:14px;font-size:14px;color:var(--ink-soft);text-align:center}
.video-cap b{color:var(--ink)}

.offers{background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:64px 0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,38px);line-height:1.15;text-wrap:balance}
h2 strong{font-weight:700}
.offers h2{margin-bottom:36px;max-width:22em}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 22px}
.tile .big{font-family:var(--display);font-weight:700;font-size:30px;color:var(--gold-deep);line-height:1}
.tile h3{font-family:var(--display);font-weight:600;font-size:18px;margin:14px 0 8px}
.tile p{font-size:15px;color:var(--ink-soft)}

.visit{padding:64px 0}
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.visit p{color:var(--ink-soft);margin-top:14px;max-width:32em}
dl{display:grid;grid-template-columns:auto 1fr;gap:12px 24px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px}
dt{font-family:var(--display);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--gold-deep);padding-top:3px}
dd{font-size:16px}
dd a{text-decoration:none;border-bottom:1px solid var(--gold)}

.final{background:var(--ink);color:var(--white);padding:64px 0;text-align:center}
.final h2{color:var(--white);margin:0 auto 10px;max-width:20em}
.final p{color:#cfcdc6}
.final .ctas{justify-content:center}
.final .btn-book{background:var(--gold);color:var(--ink)}
.final .btn-book:hover{background:#f3c95f}

footer{background:#232322;color:#9d9b94;font-size:13px;padding:22px 0 100px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

.sticky{display:none}
.dots{display:none}

@media (max-width:900px){
  .hero{padding:36px 0 48px}
  .hero .wrap{grid-template-columns:1fr;gap:36px}
  .grid{grid-template-columns:1fr 1fr}
  .visit .wrap{grid-template-columns:1fr;gap:28px}
}
@media (max-width:560px){
  header .wrap{height:64px;justify-content:center}
  header img{height:36px}
  .hero{padding:22px 0 28px}
  .hero:before{display:none}
  .hero .wrap{gap:22px;grid-template-columns:minmax(0,1fr)}
  .hero .wrap>*{min-width:0}
  .eyebrow{font-size:11px;letter-spacing:.18em}
  h1{font-size:32px;margin:8px 0 10px}
  .lede{font-size:15px;line-height:1.5}
  .lede .more{display:none}
  .ctas{margin:18px 0 12px;gap:8px;flex-wrap:nowrap}
  .ctas .btn{flex:1 1 0;justify-content:center;padding:13px 10px;font-size:14px;gap:6px}
  .ctas .btn svg{width:17px;height:17px}
  .ctas .btn .x{display:none}
  .reassure{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -24px;padding:0 24px}
  .reassure::-webkit-scrollbar{display:none}
  .reassure span{flex:none;margin:0;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
  .video-card{max-width:250px}
  .video-cap{margin-top:8px;font-size:13px}
  .offers{padding:32px 0 26px}
  .offers h2{margin-bottom:18px;font-size:26px}
  .grid{display:flex;grid-template-columns:none;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px;padding:0 24px 4px;scroll-padding:0 24px;scrollbar-width:none}
  .grid::-webkit-scrollbar{display:none}
  .tile{flex:0 0 78%;scroll-snap-align:start;padding:20px 18px}
  .tile .big{font-size:26px}
  .tile h3{margin:10px 0 6px}
  .tile p{font-size:14px}
  .dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .2s}
  .dots i.on{background:var(--gold-deep);width:18px;border-radius:4px}
  .visit{padding:30px 0 28px}
  .visit .wrap{gap:16px;grid-template-columns:minmax(0,1fr)}
  .visit h2{font-size:24px}
  .visit p{display:none}
  dl{padding:18px;gap:8px 16px}
  dd{font-size:15px}
  .final{display:none}
  footer{padding:18px 0 90px;font-size:12px}
  .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(255,253,248,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:10}
  .sticky .btn{flex:1;justify-content:center;padding:14px 10px;font-size:15px}
}

.hero{padding:40px 0 48px}.hero h1{font-size:clamp(34px,4.6vw,54px)}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 18px 40px -28px rgba(47,47,46,.35)}
.offer{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:start}
.offer h3{font-family:var(--display);font-weight:600;font-size:22px}
.offer .what{color:var(--ink-soft);font-size:15px}
.price{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;text-align:right}
.price small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink-soft);margin-top:6px;max-width:12em}
.ticks{grid-column:1/-1;list-style:none;margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:15px}
.ticks li:before{content:"\2713";color:var(--gold-deep);font-weight:700;margin-right:8px}
.pick{padding:56px 0;background:var(--gold-soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pick .card{max-width:640px;margin:22px auto 0}
.pick h2{text-align:center}.pick .sub{text-align:center;color:var(--ink-soft);margin-top:8px}
.lbl{font-weight:700;font-size:14px;margin:18px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:10px 16px;font:600 15px var(--body);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:15px var(--body);min-height:70px;resize:vertical}
.go{width:100%;justify-content:center;margin-top:20px;border:0;cursor:pointer}
.go[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ok{display:none;text-align:center;padding:10px 0}.ok h3{font-family:var(--display);font-size:26px;font-weight:600;margin-bottom:8px}
.or{text-align:center;margin-top:18px;font-size:15px;color:var(--ink-soft)}.or a{font-weight:700;border-bottom:1.5px solid var(--gold);text-decoration:none;color:var(--ink)}
.fin{padding:56px 0}.fin .wrap{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:center}
.hp{position:absolute;left:-9999px}
button{font-family:var(--body)}
.reassure{display:flex;flex-wrap:wrap;gap:6px 16px}.reassure span{margin:0}
footer{background:var(--ink);color:#d9d6cf}footer a{color:#fff}
footer{padding:28px 0;font-size:14px;color:var(--ink-soft)}footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:860px){.hero .wrap,.fin .wrap{grid-template-columns:1fr;gap:28px}.video-card{max-width:300px}.ticks{grid-template-columns:1fr}.fin .video-card{order:-1}}
@media (max-width:560px){.hero{padding:26px 0 34px}.card{padding:20px}.price{font-size:28px}.pick{padding:38px 0}}
