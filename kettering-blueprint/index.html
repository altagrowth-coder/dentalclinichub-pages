   <p class="hint" style="font-size:14px;margin-top:18px">Karnika missed the call? Send her this link so she can add her answers too.</p></div></section>`;
  if(x.t==="confirm"){const ed=state[x.id+"__edits"]||{};
   body = `<div class="cf">${x.items.map((t,k)=>`<div class="cfi ${ed[k]!=null?"edit":""}" data-k="${k}"><div class="cft"><b>${k+1}</b><span>${t}</span></div><div class="cfb"><button class="pill ok2" data-c="ok">✓ Correct</button><button class="pill ed" data-c="ed">✎ Edit</button></div><textarea class="cfe" rows="2" placeholder="What should it say?">${esc(ed[k]!=null?ed[k]:t)}</textarea></div>`).join("")}</div>
   <input class="txt cfm" data-f="${x.miss.id}" placeholder="${x.miss.ph}" value="${esc(state[x.miss.id]||"")}">
   <div><button class="ok" data-go>Confirm and continue <small>press Enter ↵</small></button></div>`;}
  if(x.t==="recap") body = `<ul class="recap">${x.items.map(s=>`<li>${s}</li>`).join("")}</ul>`;
  if(["one","many","recap"].includes(x.t)){
   const sel = [].concat(state[x.id]||[]);
   body += `<div class="opts ${x.grid?"grid":""}">${x.o.map((o,j)=>`<button class="opt ${sel.includes(o)?"on":""}" data-o="${esc(o)}"><kbd>${L[j]}</kbd>${o}<span class="tick">✓</span></button>`).join("")}</div>`;
   if(x.follow) body += `<input class="txt" data-f="${x.follow.id}" placeholder="${x.follow.ph}" value="${esc(state[x.follow.id]||"")}" style="display:${sel.includes(x.o[x.follow.when])?"block":"none"};font-size:20px">`;
   if(x.t==="many") body += `<div><button class="ok" data-go>OK ✓ <small>press Enter ↵</small></button></div>`;
   else if(x.follow) body += `<div><button class="ok" data-go style="display:${sel.includes(x.o[x.follow.when])?"inline-flex":"none"}">OK ✓</button></div>`;
  } else if(x.t!=="confirm") {
   const v = esc(state[x.id]||"");
   body = x.t==="long"?`<textarea class="txt" data-f="${x.id}" placeholder="${x.ph||""}">${v}</textarea>`
     :`<input class="txt" data-f="${x.id}" type="${x.t==="text"?"text":x.t}" placeholder="${x.ph||""}" value="${v}" autocomplete="${x.t==="email"?"email":x.t==="tel"?"tel":"name"}">`;
   const last = i===Q.length-2;
   body += `<div><button class="ok" data-go>${last?"Submit":"OK ✓"} <small>${x.t==="long"?"Shift + Enter for a new line":"press Enter ↵"}</small></button></div>`;
  }
  return `<section class="q" data-i="${i}"><div class="in">${head}${body}<div class="err"></div></div></section>`}).join("");
 bind(); show(0,true)}

function sec(i){return document.querySelector(`.q[data-i="${i}"]`)}
function show(i,instant){
 const prev=sec(cur); if(prev&&prev!==sec(i)){prev.classList.remove("on");prev.classList.toggle("up",i>cur)}
 cur=i; const s=sec(i); s.classList.remove("up"); s.classList.add("on");
 const name=(state["Filled in by"]||"").split(" ")[0];
 s.querySelectorAll("h2").forEach(h=>{const x=Q[i];if(x.q)h.innerHTML=name?x.q.replace("{name}",esc(name)):x.q.replace(", {name}","").replace("{name}","")});
 if(Q[i].t==="end"&&name) $("#endName").textContent=", "+name;
 $("#bar").style.width=Math.round(100*Math.max(0,i)/(Q.length-1))+"%";
 $("#prev").disabled=i===0||Q[i].t==="end"; $("#next").disabled=Q[i].t==="end";
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 const f=s.querySelector("input.txt,textarea.txt"); if(f&&f.offsetParent&&!/Mobi|Android/i.test(navigator.userAgent)) setTimeout(()=>f.focus(),instant?0:350)}

function valid(i){const x=Q[i],s=sec(i),e=s&&s.querySelector(".err");if(e)e.textContent="";
 if(x.req&&!(state[x.id]||"").trim()){e.textContent="Please fill this in";return false}
 if(x.t==="email"&&!/^\S+@\S+\.\S+$/.test(state[x.id]||"")){e.textContent="Hmm, that email doesn't look right";return false}
 return true}
function next(){if(Q[cur].t==="end")return;if(!valid(cur))return;
 if(cur===Q.length-2){submit();return}
 show(cur+1)}
function back(){if(cur>0&&Q[cur].t!=="end")show(cur-1)}

function pick(i,j){const x=Q[i],o=x.o[j];if(!o)return;const s=sec(i);const btn=s.querySelectorAll(".opt")[j];
 if(x.t==="many"){let a=[].concat(state[x.id]||[]);
  if(a.includes(o))a=a.filter(v=>v!==o);else{if(x.max&&a.length>=x.max){s.querySelector(".err").textContent="Up to "+x.max+", untick one first";return}a.push(o)}
  state[x.id]=a;btn.classList.toggle("on");s.querySelector(".err").textContent="";save();
  if(x.follow){const sh=a.includes(x.o[x.follow.when]);const f=s.querySelector("[data-f]");f.style.display=sh?"block":"none";if(sh&&o===x.o[x.follow.when])setTimeout(()=>f.focus(),100)}return}
 state[x.id]=o;s.querySelectorAll(".opt").forEach(b=>b.classList.remove("on"));btn.classList.add("on","flash");save();
 if(x.follow){const show2=j===x.follow.when;s.querySelector("[data-f]").style.display=show2?"block":"none";s.querySelector("[data-go]").style.display=show2?"inline-flex":"none";
  if(show2){setTimeout(()=>s.querySelector("[data-f]").focus(),100);return}}
 setTimeout(next,420)}

function bind(){
 document.querySelectorAll(".q").forEach(s=>{const i=+s.dataset.i;
  s.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(i,j));
  s.querySelectorAll("[data-go]").forEach(b=>b.onclick=next);
  s.querySelectorAll(".cfi").forEach(c=>{const k=c.dataset.k,x=Q[i],key=x.id+"__edits";
   c.querySelector('[data-c="ed"]').onclick=()=>{const e=state[key]||{};e[k]=c.querySelector(".cfe").value;state[key]=e;c.classList.add("edit");save();setTimeout(()=>c.querySelector(".cfe").focus(),60)};
   c.querySelector('[data-c="ok"]').onclick=()=>{const e=state[key]||{};delete e[k];state[key]=e;c.classList.remove("edit");c.classList.add("flash2");setTimeout(()=>c.classList.remove("flash2"),400);save()};
   c.querySelector(".cfe").oninput=ev=>{const e=state[key]||{};e[k]=ev.target.value;state[key]=e;save()}});
  s.querySelectorAll("[data-f]").forEach(f=>f.oninput=()=>{state[f.dataset.f]=f.value;save()})});
 $("#prev").onclick=back;$("#next").onclick=next;
 document.addEventListener("keydown",e=>{const x=Q[cur];const typing=e.target.matches("input,textarea");
  if(e.key==="Enter"&&!(e.target.tagName==="TEXTAREA"&&e.shiftKey)){e.preventDefault();next();return}
  if(typing)return;
  const j=L.indexOf(e.key.toUpperCase());if(x.o&&j>=0&&j<x.o.length&&e.key.length===1)pick(cur,j);
  if(e.key==="ArrowUp")back();if(e.key==="ArrowDown")next()});
 let wl=0;addEventListener("wheel",e=>{if(Date.now()-wl<900||Math.abs(e.deltaY)<40)return;const s=sec(cur);if(s.scrollHeight>s.clientHeight+4)return;wl=Date.now();e.deltaY>0?next():back()},{passive:true})}

function payload(){const sections={},answers={};let n=0;
 Q.forEach(x=>{if(!x.id)return;n++;let v=state[x.id];
  if(x.t==="confirm"){const e=state[x.id+"__edits"]||{};const ch=Object.keys(e).filter(k=>e[k].trim()&&e[k].trim()!==x.items[k]);
   v=ch.length?ch.map(k=>"Change "+(+k+1)+": \""+x.items[k]+"\" -> \""+e[k].trim()+"\"").join(" | ")+" | Rest confirmed":"All confirmed";
   if(state[x.miss.id])v+=" | Missed: "+state[x.miss.id];}if(Array.isArray(v))v=v.join(", ");
  if(x.follow&&state[x.follow.id]&&[].concat(state[x.id]||[]).includes(x.o[x.follow.when]))v+=": "+state[x.follow.id];
  if(v===undefined||v==="")v="(skipped)";const k=x.id;answers[k]=v;(sections["Answers"]=sections["Answers"]||{})[n+". "+k]=v});
 return {source:"bespoke-blueprint",final:true,practice:"Kettering & Wellingborough Dental",name:state["Filled in by"]||"",email:state["Email"]||"",mobile:state["Mobile"]||"",
  must_haves:[].concat(state["Must-have features"]||[]),sections,answers,page:location.href.split("?")[0],sent_at:new Date().toISOString()}}
function submit(){if(!sent){sent=true;try{fetch(HOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())})}catch(e){}}
 state.sent=new Date().toISOString();save();show(Q.length-1);confetti()}

function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#00B3A4","#3fd0c3","#f2a33a","#ffffff","#8fd8ff"];
 const P=Array.from({length:170},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*15,vy:Math.random()*-13-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));let f=0;
 (function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
render();
</script>
</body>
