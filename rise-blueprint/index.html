<style>
:root{--navy:#1F3B5C;--navy2:#132a44;--teal:#00B3A4;--soft:#b9c8d8;--line:rgba(255,255,255,.22)}

<script>
const VIDEO = "https://www.tella.com/video/proposal-builder-walkthrough-bnaf6ynm/embed";
const HOOK = "https://api.viktor.com/api/triggers/in/webhook/wh_vTTkaQmMIw2-uD_CQkDSxjwy?token=vtrtok__1CO_JfSm36VKvqw_ot_0RkLxVGfWDC1BwIh2-LzYVA";
const KEY = "altadent-rise-tf-v1";

/* ===== QUESTIONS ===== type: welcome | text | email | tel | long | one | many | recap | end */
const Q = [
  {
    "t": "welcome"
  },
  {
    "id": "Filled in by",
    "t": "text",
    "q": "First things first, what's your name?",
    "req": 1,
    "ph": "Your name"
  },
  {
    "id": "Starting point",
    "t": "confirm",
    "q": "Is this the right starting point for Rise, {name}?",
    "hint": "A starting point from your website. Please update anything that has changed or is still to confirm.",
    "items": [
      "Rise Dental & Medical is preparing to launch in Chelmsford, with Nev and Tanvi as the founders.",
      "The website describes private dental and preventative medical services, with a priority waitlist.",
      "The website mentions sedation, evening and weekend availability, membership and finance. Please confirm the scope and launch timing below."
    ],
    "miss": {
      "id": "Anything we missed",
      "ph": "Anything to add or still to confirm? (optional)"
    }
  },
  {
    "id": "Contacts and decision-makers",
    "t": "long",
    "q": "Who should shape and approve the proposal?",
    "hint": "Roles are enough if names are still to confirm.",
    "ph": "Nev, Tanvi and anyone else: roles, decision-maker, day-to-day lead and who signs off scope and content"
  },
  {
    "id": "Email",
    "t": "email",
    "q": "Where should we send your bespoke proposal?",
    "req": 1,
    "ph": "Your work email"
  },
  {
    "id": "Mobile",
    "t": "tel",
    "q": "What is the best number for the follow-up?",
    "hint": "Only used to arrange your follow-up.",
    "ph": "Optional"
  },
  {
    "id": "Go-live",
    "t": "long",
    "q": "What are the launch phases and target dates?",
    "hint": "A rough sequence is enough. Separate the clinic opening from the system go-live if needed.",
    "ph": "Opening date or target month; dental and medical phases; waitlist launch; dependencies or dates still to confirm"
  },
  {
    "id": "Services",
    "t": "many",
    "q": "Which services should we plan around?",
    "o": [
      "General dentistry and hygiene",
      "Implants",
      "Teeth straightening",
      "Cosmetic dentistry",
      "Children's dentistry",
      "Sedation",
      "Preventative medical care",
      "Other medical services",
      "To confirm / add details"
    ],
    "grid": 1,
    "follow": {
      "when": 8,
      "id": "Service details",
      "ph": "Other services, launch phases or details still to confirm"
    }
  },
  {
    "id": "Treatment priorities",
    "t": "long",
    "q": "Which dental and medical services come first?",
    "hint": "Please clarify the medical services and age groups in scope. No patient details.",
    "ph": "Top 3 priorities; launch vs later services; key patient groups; any services that must stay separate"
  },
  {
    "id": "Top goals",
    "t": "long",
    "q": "What would a successful first 90 days look like?",
    "hint": "Estimates or \"to confirm\" are fine. No need to set every target now.",
    "ph": "Your targets for enquiries, bookings, attendance, treatment acceptance or revenue; dental vs medical; any baseline figures"
  },
  {
    "id": "Clinical capacity",
    "t": "long",
    "q": "What capacity should the launch plan work around?",
    "hint": "Approximate figures are enough. Please include any shared rooms or clinician constraints.",
    "ph": "Dental surgeries and medical rooms; clinicians and roles; sessions per week; new-patient slots; capacity at launch vs later"
  },
  {
    "id": "Opening and contact hours",
    "t": "long",
    "q": "When will Rise be open and available to respond?",
    "hint": "Separate appointment availability from the hours someone can answer enquiries.",
    "ph": "Days and hours, evenings/weekends, dental vs medical sessions, reception hours and holiday cover"
  },
  {
    "id": "Waitlist",
    "t": "long",
    "q": "How does the priority waitlist work today?",
    "hint": "Please describe the consent wording and privacy notice, not individual contacts. To confirm is fine.",
    "ph": "Where sign-ups come from; approximate count; where held; what they opted into; evidence of consent; who can export it"
  },
  {
    "id": "Migration",
    "t": "long",
    "q": "What should move into the new system?",
    "hint": "We will agree an export and validation plan later. Do not upload contact lists or patient records here.",
    "ph": "Waitlist and other sources; approximate counts; fields, consent records, stages and notes needed; timing and migration owner"
  },
  {
    "id": "Systems",
    "t": "many",
    "q": "Which systems are chosen or still being decided?",
    "o": [
      "Dental PMS chosen",
      "Medical record system chosen",
      "Online booking chosen",
      "Phone system chosen",
      "Payments / finance tools chosen",
      "Existing CRM or waitlist tools",
      "To confirm / list systems"
    ],
    "grid": 1,
    "follow": {
      "when": 6,
      "id": "System details",
      "ph": "Names, chosen vs shortlisted, or all still to confirm"
    },
    "hint": "Select the last option to list the names or mark decisions as open. We will confirm integration feasibility before scope is agreed."
  },
  {
    "id": "Integration owners",
    "t": "long",
    "q": "Who can confirm the systems and integrations?",
    "hint": "Contacts and system names only. No passwords, API keys or patient information. \"To confirm\" is a valid answer.",
    "ph": "Dental PMS and medical record system names if known; booking, payments and other tools; supplier contacts; source owner; API/export availability; who approves access"
  },
  {
    "id": "Website and booking",
    "t": "long",
    "q": "Where will enquiries come from, and which links should we use?",
    "hint": "Working links or the person who can supply them are enough.",

  },
  {
    "id": "Pipeline stages",

  {

  },
  {
    "id": "AI scope",

    "q": "What would you like the AI to help with?",
    "o": [
      "Approved practice and service FAQs",
      "Non-clinical enquiry qualification",
      "Booking requests and handovers",
      "Waitlist questions",
      "Approved payment and membership information",
      "Staff support only at first",
      "To confirm / add boundaries"
    ],
    "grid": 1,
    "follow": {
      "when": 6,

  },
  {

  },

  {

  },

  },
  {
    "id": "Reporting and tracking",

  },
  {
    "id": "Assets and access contacts",
    "t": "long",
    "q": "Who can supply the assets and approve access?",
    "hint": "Names or roles and work contact details only. Do not send passwords, API keys, patient records or account credentials. Secure access is arranged separately.",
    "ph": "Brand assets, service copy, team photos, policy links; website/domain, analytics/ads, booking and systems contacts; reporting cadence and tracking owner if known"
  },
  {
    "id": "Must-have features",
    "t": "many",
    "q": "Which parts are must-haves for the first phase?",
    "o": [
      "Waitlist import and launch follow-up",

      "Dental and medical booking journeys",

    ],
    "grid": 1,

  },
  {
    "id": "Phasing and dependencies",
    "t": "long",
    "q": "What is essential at launch, and what can follow later?",

  },

];
const L = "ABCDEFGHIJKLMNOP";
let state = {}; try{state = JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let cur = 0, sent = false;
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const qn = Q.filter(x=>x.id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){};$("#saved").textContent="Saved"}

function videoHTML(){let u=(new URLSearchParams(location.search).get("v"))||VIDEO;
 if(u&&!u.startsWith("__")){let src=u.trim();const m=src.match(/tella\.(?:tv|com)\/video\/([^/?#]+)/);if(m)src="https://www.tella.com/video/"+m[1]+"/embed?b=0&title=0&a=1&loop=0&t=0&muted=0&wt=0";
  return `<div class="video"><iframe src="${esc(src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="Clinic proposal blueprint walkthrough"></iframe></div>`}
 return `<div class="video"><div class="vph"><div class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>A quick hello from Sim</div></div>`}

function render(){
 $("#stage").innerHTML = Q.map((x,i)=>{
  const n = qn.indexOf(x)+1;
  const head = x.id?`<div class="num">${n} <span>→</span></div><h2>${x.q}</h2>${x.hint?`<p class="hint">${x.hint}</p>`:""}`:"";
  let body="";
  if(x.t==="welcome") return `<section class="q welcome" data-i="${i}"><div class="in">
   <div class="num">For Nev and Tanvi at Rise Dental &amp; Medical</div>
   <h1>Let's design <em>your</em> system.</h1>
   <p class="hint">Watch the walkthrough, then help us shape Rise's launch from first enquiry to aftercare. Unknowns are welcome. Please share process details only, not patient information or passwords.</p>
   ${videoHTML()}
   <button class="ok big" data-go>${state._at>1&&!state.sent?"Continue where you left off":"Let's start"} <small>press Enter ↵</small></button>
   <div class="meta"><span>⏱ About 15 minutes</span><span>✓ ${qn.length} focused questions</span><span>↺ Pick up where you left off</span></div></div></section>`;
  if(x.t==="end") return `<section class="q" data-i="${i}"><div class="in" style="text-align:center">
   <h1 style="font-size:clamp(32px,5vw,48px)">Thank you<span id="endName"></span>! 🎉</h1>
   <p class="hint" style="max-width:520px;margin:14px auto 0">Your answers are with Sim. We'll turn them into a focused proposal and walk you through it on our next call.</p>
   <a class="ok big" href="https://app.iclosed.io/e/altadent/altadent-discovery-call" style="text-decoration:none">Book the follow-up call</a>
   <div><a class="wa wa2" href="https://wa.me/447940636939?text=Hi%20Sim%2C%20it%27s%20Nev%20and%20Tanvi%20at%20Rise%20Dental%20%26%20Medical%20about%20our%20blueprint" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg><span>Or WhatsApp Sim</span></a></div>
   <p class="hint" style="font-size:14px;margin-top:18px">Share this link with your team if you would like their input. Answers save on this device.</p></div></section>`;
  if(x.t==="confirm"){const ed=state[x.id+"__edits"]||{};
   body = `<div class="cf">${x.items.map((t,k)=>`<div class="cfi ${ed[k]!=null?"edit":""}" data-k="${k}"><div class="cft"><b>${k+1}</b><span>${t}</span></div><div class="cfb"><button class="pill ok2" data-c="ok">✓ Correct</button><button class="pill ed" data-c="ed">✎ Edit</button></div><textarea class="cfe" rows="2" placeholder="What should it say?">${esc(ed[k]!=null?ed[k]:t)}</textarea></div>`).join("")}</div>
   <input class="txt cfm" data-f="${x.miss.id}" placeholder="${x.miss.ph}" value="${esc(state[x.miss.id]||"")}">
   <div><button class="ok" data-go>Confirm and continue <small>press Enter ↵</small></button></div>`;}
  if(x.t==="recap") body = `<ul class="recap">${x.items.map(s=>`<li>${s}</li>`).join("")}</ul>`;
  if(["one","many","recap"].includes(x.t)){
   const sel = [].concat(state[x.id]||[]);
   body += `<div class="opts ${x.grid?"grid":""}">${x.o.map((o,j)=>`<button class="opt ${sel.includes(o)?"on":""}" data-o="${esc(o)}"><kbd>${L[j]}</kbd>${o}<span class="tick">✓</span></button>`).join("")}</div>`;
   if(x.follow) body += `<input class="txt" data-f="${x.follow.id}" placeholder="${x.follow.ph}" value="${esc(state[x.follow.id]||"")}" style="display:${sel.includes(x.o[x.follow.when])?"block":"none"};font-size:20px">`;
   if(x.t==="many") body += `<div><button class="ok" data-go>OK ✓ <small>press Enter ↵</small></button></div>`;
   else if(x.follow) body += `<div><button class="ok" data-go style="display:${sel.includes(x.o[x.follow.when])?"inline-flex":"none"}">OK ✓</button></div>`;
  } else if(x.t!=="confirm") {
   const v = esc(state[x.id]||"");
   body = x.t==="long"?`<textarea class="txt" data-f="${x.id}" placeholder="${x.ph||""}">${v}</textarea>`
     :`<input class="txt" data-f="${x.id}" type="${x.t==="text"?"text":x.t}" placeholder="${x.ph||""}" value="${v}" autocomplete="${x.t==="email"?"email":x.t==="tel"?"tel":"name"}">`;
   const last = i===Q.length-2;
   body += `<div><button class="ok" data-go>${last?"Submit":"OK ✓"} <small>${x.t==="long"?"Shift + Enter for a new line":"press Enter ↵"}</small></button></div>`;
  }
  return `<section class="q" data-i="${i}"><div class="in">${head}${body}<div class="err"></div></div></section>`}).join("");
 bind(); show(0,true)}

function sec(i){return document.querySelector(`.q[data-i="${i}"]`)}
function show(i,instant){
 const prev=sec(cur); if(prev&&prev!==sec(i)){prev.classList.remove("on");prev.classList.toggle("up",i>cur)}
 cur=i; if(i>0&&Q[i].t!=="end"){state._at=i;save()} const s=sec(i); s.classList.remove("up"); s.classList.add("on");
 const name=(state["Filled in by"]||"").split(" ")[0];
 s.querySelectorAll("h2").forEach(h=>{const x=Q[i];if(x.q)h.innerHTML=name?x.q.replace("{name}",esc(name)):x.q.replace(", {name}","").replace("{name}","")});
 if(Q[i].t==="end"&&name) $("#endName").textContent=", "+name;
 $("#bar").style.width=Math.round(100*Math.max(0,i)/(Q.length-1))+"%";
 $("#prev").disabled=i===0||Q[i].t==="end"; $("#next").disabled=Q[i].t==="end";
 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
 const f=s.querySelector("input.txt,textarea.txt"); if(f&&f.offsetParent&&!/Mobi|Android/i.test(navigator.userAgent)) setTimeout(()=>f.focus(),instant?0:350)}

function valid(i){const x=Q[i],s=sec(i),e=s&&s.querySelector(".err");if(e)e.textContent="";
 if(x.req&&!(state[x.id]||"").trim()){e.textContent="Please fill this in";return false}
 if(x.t==="email"&&!/^\S+@\S+\.\S+$/.test(state[x.id]||"")){e.textContent="Hmm, that email doesn't look right";return false}
 return true}
function next(){if(Q[cur].t==="end")return;if(!valid(cur))return;
 if(cur===0&&state._at>1&&!state.sent&&state._at<Q.length-1){show(state._at);return}
 if(cur===Q.length-2){submit();return}
 show(cur+1)}
function back(){if(cur>0&&Q[cur].t!=="end")show(cur-1)}

function pick(i,j){const x=Q[i],o=x.o[j];if(!o)return;const s=sec(i);const btn=s.querySelectorAll(".opt")[j];
 if(x.t==="many"){let a=[].concat(state[x.id]||[]);
  if(a.includes(o))a=a.filter(v=>v!==o);else{if(x.max&&a.length>=x.max){s.querySelector(".err").textContent="Up to "+x.max+", untick one first";return}a.push(o)}
  state[x.id]=a;btn.classList.toggle("on");s.querySelector(".err").textContent="";save();
  if(x.follow){const sh=a.includes(x.o[x.follow.when]);const f=s.querySelector("[data-f]");f.style.display=sh?"block":"none";if(sh&&o===x.o[x.follow.when])setTimeout(()=>f.focus(),100)}return}
 state[x.id]=o;s.querySelectorAll(".opt").forEach(b=>b.classList.remove("on"));btn.classList.add("on","flash");save();
 if(x.follow){const show2=j===x.follow.when;s.querySelector("[data-f]").style.display=show2?"block":"none";s.querySelector("[data-go]").style.display=show2?"inline-flex":"none";
  if(show2){setTimeout(()=>s.querySelector("[data-f]").focus(),100);return}}
 setTimeout(next,420)}

function bind(){
 document.querySelectorAll(".q").forEach(s=>{const i=+s.dataset.i;
  s.querySelectorAll(".opt").forEach((b,j)=>b.onclick=()=>pick(i,j));
  s.querySelectorAll("[data-go]").forEach(b=>b.onclick=next);
  s.querySelectorAll(".cfi").forEach(c=>{const k=c.dataset.k,x=Q[i],key=x.id+"__edits";
   c.querySelector('[data-c="ed"]').onclick=()=>{const e=state[key]||{};e[k]=c.querySelector(".cfe").value;state[key]=e;c.classList.add("edit");save();setTimeout(()=>c.querySelector(".cfe").focus(),60)};
   c.querySelector('[data-c="ok"]').onclick=()=>{const e=state[key]||{};delete e[k];state[key]=e;c.classList.remove("edit");c.classList.add("flash2");setTimeout(()=>c.classList.remove("flash2"),400);save()};
   c.querySelector(".cfe").oninput=ev=>{const e=state[key]||{};e[k]=ev.target.value;state[key]=e;save()}});
  s.querySelectorAll("[data-f]").forEach(f=>f.oninput=()=>{state[f.dataset.f]=f.value;save()})});
 $("#prev").onclick=back;$("#next").onclick=next;
 document.addEventListener("keydown",e=>{const x=Q[cur];const typing=e.target.matches("input,textarea");
  if(e.key==="Enter"&&!(e.target.tagName==="TEXTAREA"&&e.shiftKey)){e.preventDefault();next();return}
  if(typing)return;
  const j=L.indexOf(e.key.toUpperCase());if(x.o&&j>=0&&j<x.o.length&&e.key.length===1)pick(cur,j);
  if(e.key==="ArrowUp")back();if(e.key==="ArrowDown")next()});
 let wl=0;addEventListener("wheel",e=>{if(Date.now()-wl<900||Math.abs(e.deltaY)<40)return;const s=sec(cur);if(s.scrollHeight>s.clientHeight+4)return;wl=Date.now();e.deltaY>0?next():back()},{passive:true})}

function payload(){const sections={},answers={};let n=0;
 Q.forEach(x=>{if(!x.id)return;n++;let v=state[x.id];
  if(x.t==="confirm"){const e=state[x.id+"__edits"]||{};const ch=Object.keys(e).filter(k=>e[k].trim()&&e[k].trim()!==x.items[k]);
   v=ch.length?ch.map(k=>"Change "+(+k+1)+": \""+x.items[k]+"\" -> \""+e[k].trim()+"\"").join(" | ")+" | Rest confirmed":"All confirmed";
   if(state[x.miss.id])v+=" | Missed: "+state[x.miss.id];}if(Array.isArray(v))v=v.join(", ");
  if(x.follow&&state[x.follow.id]&&[].concat(state[x.id]||[]).includes(x.o[x.follow.when]))v+=": "+state[x.follow.id];
  if(v===undefined||v==="")v="(skipped)";const k=x.id;answers[k]=v;(sections["Answers"]=sections["Answers"]||{})[n+". "+k]=v});
 return {source:"bespoke-blueprint",final:true,practice:"Rise Dental & Medical",name:state["Filled in by"]||"",email:state["Email"]||"",mobile:state["Mobile"]||"",
  must_haves:[].concat(state["Must-have features"]||[]),sections,answers,page:location.href.split("?")[0],sent_at:new Date().toISOString()}}
function submit(){if(!sent){sent=true;try{fetch(HOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())})}catch(e){}}
 state.sent=new Date().toISOString();save();show(Q.length-1);confetti()}

function confetti(){const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#00B3A4","#3fd0c3","#f2a33a","#ffffff","#8fd8ff"];
 const P=Array.from({length:170},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*15,vy:Math.random()*-13-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));let f=0;
 (function t(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<170)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)})()}
render();
</script>
